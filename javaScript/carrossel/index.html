<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel de Imagens</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h2>Carrossel de Imagens</h2>
        <div class="carrossel">
            <button id="btnAnterior">Anterior</button>
            <div class="slide-container">
                <div class="slide">
                    <img src="imgs/vestido azul.jpg" alt="Imagem 1">
                </div>
                <div class="slide">
                    <img src="imgs/vestido verde.jpg" alt="Imagem 2">
                </div>
                <div class="slide">
                    <img src="imgs/vestido.jpg" alt="Imagem 3">
                </div>
            </div>
            <button id="btnProximo">Próximo</button>
        </div>
    </div>

    <script src="script.js"></script> 
</body>

</html>
