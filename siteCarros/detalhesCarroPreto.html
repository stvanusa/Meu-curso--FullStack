<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Carro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <img src="img/logo/logo1.png" alt="Logo" id="logo">
        <nav>
            <a href="index.html">Início</a>
            <a href="lista.html">Carros</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>
    <main>
        <section id="car-details">
            <h2>Modelo do Carro</h2>
            <img src="img/lista/preto.png" alt="Modelo do Carro">
            <p><strong>Marca:</strong> Fiat</p>
            <p><strong>Modelo:</strong>Fiat Strada 2021 a 2023</p>
            <p><strong>Preço:</strong> R$ 100.000,00</p>
            <p><strong>Descrição:</strong> Descrição completa do carro.</p>

            <h3>Solicitar Contato</h3>
            <form id="contact-form">
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Mensagem:</label>
                <textarea id="message" name="message" required></textarea>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Vendas de Carros Novos. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
